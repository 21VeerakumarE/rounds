         the public site; scripts/check-dist.ts fails the build if og:image/twitter:image drift. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Rounds">

    <meta property="og:description" content="Take the history. Make the call. A daily clinical reasoning case for med students.">

    <link rel="manifest" href="./manifest.webmanifest">
    <!-- m-5: the phone status bar / installed-app title bar follows the theme: scrub teal in light,
         the dark topbar surface in dark. An explicit in-app choice overrides both (the script below
         on first paint, then src/ui/themeColor.ts). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0a6c7d">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141b21">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <script>
      // Applies a saved light/dark theme before first paint, so a reload never flashes the
      // wrong theme. 'system' (or no saved setting) leaves the attribute unset, matching
      // prefers-color-scheme via CSS; the React effect in App.tsx re-applies this on later
      // theme changes. Keep the key in sync with SETTINGS_KEY in src/storage/settings.ts.
      try {
        var raw = localStorage.getItem('crg.settings.v1');
        var s = raw ? JSON.parse(raw) : null;
        if (s && (s.theme === 'light' || s.theme === 'dark')) {
          document.documentElement.dataset.theme = s.theme;
          // Keep in sync with THEME_COLOR in src/ui/themeColor.ts.
          var tc = s.theme === 'dark' ? '#141b21' : '#0a6c7d';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', tc); });
        }
      } catch (e) { /* storage unavailable or garbage: fall back to prefers-color-scheme */ }
    </script>
    <script type="module" crossorigin src="./assets/index-C0wkDRXk.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-bGOer7EI.css">
